<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configurador Comercial</title>

<style>
:root{
    --negro:#171717;
    --gris:#68707d;
    --gris-claro:#f5f6f8;
    --borde:#e2e5e9;
    --masmovil:#f2c400;
    --yoigo:#b41472;
    --vodafone:#e60000;
    --lowi:#d51f26;
    --blanco:#fff;
}

*{box-sizing:border-box}

body{
    margin:0;
    background:#f4f5f7;
    color:var(--negro);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

button,input,select{font:inherit}
button{cursor:pointer}

.header{
    background:#fff;
    border-bottom:1px solid var(--borde);
    position:sticky;
    top:0;
    z-index:50;
}

.header-inner{
    max-width:1200px;
    margin:auto;
    min-height:65px;
    padding:0 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:18px;
    font-weight:900;
}

.logo span{
    background:#171717;
    color:#fff;
    padding:5px 8px;
    border-radius:7px;
    margin-right:7px;
}

.container{
    width:min(1200px,calc(100% - 30px));
    margin:auto;
}

main{
    padding:35px 0 60px;
}

.hero{
    text-align:center;
    max-width:750px;
    margin:0 auto 35px;
}

.eyebrow{
    color:var(--gris);
    font-size:11px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:.12em;
}

.hero h1{
    font-size:40px;
    line-height:1.05;
    margin:8px 0 12px;
    letter-spacing:-1px;
}

.hero p{
    color:var(--gris);
    font-size:15px;
    line-height:1.55;
    margin:0;
}

.company-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
}

.company-card{
    background:#fff;
    border:1px solid var(--borde);
    border-radius:20px;
    padding:24px;
    min-height:245px;
    text-align:left;
    position:relative;
    overflow:hidden;
    transition:.15s;
}

.company-card:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 30px rgba(0,0,0,.07);
}

.company-card::before{
    content:"";
    position:absolute;
    left:0;
    right:0;
    top:0;
    height:5px;
    background:var(--company);
}

.company-card.masmovil{--company:var(--masmovil)}
.company-card.yoigo{--company:var(--yoigo)}
.company-card.vodafone{--company:var(--vodafone)}
.company-card.lowi{--company:var(--lowi)}

.company-logo{
    font-size:26px;
    font-weight:950;
    margin-bottom:25px;
}

.company-card.masmovil .company-logo span{
    background:var(--masmovil);
    padding:2px 6px;
    border-radius:5px;
}

.company-card.yoigo .company-logo{color:var(--yoigo)}
.company-card.vodafone .company-logo{color:var(--vodafone)}
.company-card.lowi .company-logo{color:var(--lowi)}

.company-card h2{
    font-size:19px;
    margin:0 0 7px;
}

.company-card p{
    color:var(--gris);
    font-size:12px;
    line-height:1.5;
    margin:0;
}

.company-go{
    font-size:12px;
    font-weight:900;
    margin-top:20px;
}

.company-card.yoigo .company-go{color:var(--yoigo)}
.company-card.vodafone .company-go{color:var(--vodafone)}
.company-card.lowi .company-go{color:var(--lowi)}

.workspace-head{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:15px;
}

.company-title{
    font-size:27px;
    font-weight:950;
    margin-right:auto;
}

.company-title.yoigo{color:var(--yoigo)}
.company-title.vodafone{color:var(--vodafone)}
.company-title.lowi{color:var(--lowi)}

.btn{
    border:1px solid var(--borde);
    background:#fff;
    padding:10px 14px;
    border-radius:10px;
    font-size:13px;
    font-weight:800;
}

.btn:hover{
    border-color:#b7bcc3;
}

.btn-full{
    width:100%;
}

.btn-masmovil{
    background:var(--masmovil);
    border-color:var(--masmovil);
    color:#111;
}

.btn-yoigo{
    background:var(--yoigo);
    border-color:var(--yoigo);
    color:#fff;
}

.btn-vodafone{
    background:var(--vodafone);
    border-color:var(--vodafone);
    color:#fff;
}

.btn-lowi{
    background:var(--lowi);
    border-color:var(--lowi);
    color:#fff;
}

.search{
    width:100%;
    background:#fff;
    border:1px solid var(--borde);
    border-radius:12px;
    padding:13px 14px;
    margin-bottom:14px;
}

.tabs{
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding-bottom:5px;
    margin-bottom:18px;
}

.tab{
    white-space:nowrap;
    background:#fff;
    border:1px solid var(--borde);
    border-radius:999px;
    padding:9px 15px;
    font-size:12px;
    font-weight:850;
}

.tab.active{
    background:#171717;
    color:#fff;
}

.tab.active.yoigo{
    background:var(--yoigo);
    border-color:var(--yoigo);
}

.tab.active.vodafone{
    background:var(--vodafone);
    border-color:var(--vodafone);
}

.tab.active.lowi{
    background:var(--lowi);
    border-color:var(--lowi);
}

.layout{
    display:grid;
    grid-template-columns:minmax(0,1fr) 360px;
    gap:18px;
    align-items:start;
}

.card{
    background:#fff;
    border:1px solid var(--borde);
    border-radius:16px;
    padding:18px;
    margin-bottom:14px;
}

.card h3{
    font-size:15px;
    margin:0 0 14px;
}

.label{
    color:var(--gris);
    font-size:10px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:.06em;
    margin:14px 0 7px;
}

.select{
    width:100%;
    background:#fff;
    border:1px solid var(--borde);
    border-radius:10px;
    padding:11px 12px;
}

.options{
    display:grid;
    gap:8px;
}

.option{
    width:100%;
    text-align:left;
    background:#fff;
    border:1px solid var(--borde);
    border-radius:12px;
    padding:13px;
    transition:.12s;
}

.option:hover{
    border-color:#aeb4bc;
}

.option.selected{
    border:2px solid #171717;
    padding:12px;
}

.option.selected.yoigo{border-color:var(--yoigo)}
.option.selected.vodafone{border-color:var(--vodafone)}
.option.selected.lowi{border-color:var(--lowi)}

.option.disabled{
    background:#f7f7f8;
    opacity:.65;
    cursor:not-allowed;
}

.option-title{
    font-size:13px;
    font-weight:900;
}

.option-price{
    float:right;
    font-size:13px;
    font-weight:950;
}

.option-detail{
    color:var(--gris);
    font-size:11px;
    line-height:1.45;
    margin-top:5px;
}

.badge{
    display:inline-block;
    background:#f0f1f3;
    border-radius:999px;
    padding:4px 7px;
    font-size:9px;
    font-weight:900;
    margin-top:7px;
}

.badge.included{
    background:#e8f5e9;
    color:#24752c;
}

.badge.added{
    background:#fff4d7;
}

.included-line{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    border:1px solid var(--borde);
    border-radius:11px;
    padding:11px;
    margin-top:7px;
}

.included-line strong{
    font-size:12px;
}

.included-line small{
    display:block;
    color:var(--gris);
    font-size:10px;
    margin-top:2px;
}

.pill{
    background:#e8f5e9;
    color:#24752c;
    border-radius:999px;
    padding:5px 8px;
    font-size:9px;
    font-weight:900;
    white-space:nowrap;
}

.add-line{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    gap:8px;
    margin-top:8px;
}

.selected-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    border:1px solid var(--borde);
    border-radius:10px;
    padding:10px;
    margin-top:7px;
}

.selected-item strong{
    font-size:11px;
}

.selected-item span{
    font-size:11px;
    font-weight:900;
}

.remove{
    border:0;
    background:#f0f1f3;
    border-radius:7px;
    padding:7px 9px;
    font-size:10px;
    font-weight:850;
    margin-left:5px;
}

.included-extra{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border:1px solid #dcebdd;
    background:#f7fbf7;
    border-radius:12px;
    padding:12px;
}

.included-extra strong{
    font-size:12px;
}

.included-extra small{
    display:block;
    color:#4d7a51;
    font-size:10px;
    margin-top:3px;
}

.summary{
    background:#fff;
    border:1px solid var(--borde);
    border-radius:18px;
    overflow:hidden;
    position:sticky;
    top:85px;
}

.summary.masmovil{border-top:6px solid var(--masmovil)}
.summary.yoigo{border-top:6px solid var(--yoigo)}
.summary.vodafone{border-top:6px solid var(--vodafone)}
.summary.lowi{border-top:6px solid var(--lowi)}

.summary-body{
    padding:18px;
}

.summary h3{
    font-size:13px;
    margin:0 0 14px;
}

.price-block{
    border-top:1px solid var(--borde);
    border-bottom:1px solid var(--borde);
    padding:15px 0;
}

.price-label{
    color:var(--gris);
    font-size:11px;
}

.big-price{
    font-size:36px;
    font-weight:950;
    line-height:1.1;
    margin:4px 0;
}

.big-price small{
    font-size:12px;
}

.after-price{
    font-size:14px;
    font-weight:850;
    margin-top:5px;
}

.breakdown{
    background:#fafafa;
    border-radius:11px;
    padding:11px;
    margin:12px 0;
}

.break-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    font-size:11px;
    padding:4px 0;
}

.break-row.total{
    border-top:1px solid var(--borde);
    padding-top:8px;
    margin-top:5px;
    font-weight:950;
}

.summary-list{
    list-style:none;
    padding:0;
    margin:13px 0;
}

.summary-list li{
    border-bottom:1px solid #f0f0f0;
    padding:8px 0;
    font-size:11px;
    line-height:1.45;
}

.summary-list li:last-child{
    border:0;
}

.info{
    background:#f5f6f8;
    border-radius:10px;
    padding:10px;
    font-size:10.5px;
    line-height:1.5;
    margin:12px 0;
}

.actions{
    display:grid;
    gap:8px;
}

.results{
    display:grid;
    gap:8px;
}

.result{
    background:#fff;
    border:1px solid var(--borde);
    border-radius:12px;
    padding:13px;
}

.result strong{
    font-size:12px;
}

.result-price{
    float:right;
    font-weight:950;
}

.result p{
    color:var(--gris);
    font-size:10.5px;
    line-height:1.45;
    margin:5px 0 0;
}

.empty{
    border:1px dashed #c7ccd2;
    border-radius:12px;
    padding:28px;
    text-align:center;
    color:var(--gris);
    font-size:12px;
}

.modal-bg{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal{
    width:min(600px,100%);
    max-height:90vh;
    overflow:auto;
    background:#fff;
    border-radius:18px;
    padding:20px;
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.modal h2{
    margin:0;
    font-size:19px;
}

.close{
    border:0;
    background:#f0f1f3;
    border-radius:8px;
    padding:8px 11px;
    font-weight:900;
}

.condition{
    border:1px solid var(--borde);
    border-radius:10px;
    padding:11px;
    font-size:11px;
    line-height:1.5;
    margin-top:8px;
}

.client-wrap{
    max-width:570px;
    margin:20px auto;
}

.client-card{
    background:#fff;
    border:1px solid var(--borde);
    border-radius:22px;
    padding:26px;
}

.client-company{
    color:var(--gris);
    font-size:11px;
    font-weight:900;
    text-transform:uppercase;
}

.client-card h1{
    font-size:28px;
    margin:7px 0 18px;
}

.client-price{
    font-size:44px;
    font-weight:950;
}

.client-price small{
    font-size:13px;
}

.client-after{
    color:var(--gris);
    font-size:12px;
    margin:5px 0 18px;
}

.client-item{
    border-bottom:1px solid var(--borde);
    padding:11px 0;
    font-size:12px;
}

.client-note{
    background:#f5f6f8;
    border-radius:11px;
    padding:11px;
    font-size:10px;
    line-height:1.5;
    margin-top:15px;
}

@media(max-width:1000px){
    .company-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .layout{
        grid-template-columns:1fr;
    }

    .summary{
        position:static;
    }
}

@media(max-width:600px){

    .container{
        width:calc(100% - 18px);
    }

    .hero h1{
        font-size:30px;
    }

    .company-grid{
        grid-template-columns:1fr;
    }

    .company-card{
        min-height:auto;
    }

    .add-line{
        grid-template-columns:1fr;
    }

    .big-price{
        font-size:32px;
    }
}

</style>
</head>

/* ============================================================
   UTILIDADES
============================================================ */

function euro(value){

    return Number(value).toLocaleString(
        "es-ES",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    ) + " €";

}


function data(){

    return DATA[state.company];

}


function reset(){

    state.base=null;
    state.lines=[];
    state.extras=[];

}


function total(){

    let value=0;

    if(state.base){

        value +=
            Number(state.base.precio) || 0;

    }

    state.lines.forEach(
        line => {

            value +=
                Number(line.precio) || 0;

        }
    );


    state.extras.forEach(
        extra => {

            value +=
                Number(extra.precio) || 0;

        }
    );


    return value;

}


function totalAfter(){

    if(!state.base){
        return null;
    }


    if(
        state.base.despues === null ||
        state.base.despues === undefined
    ){

        return null;

    }


    let value =
        Number(state.base.despues) || 0;


    state.lines.forEach(
        line => {

            value +=
                Number(line.precio) || 0;

        }
    );


    state.extras.forEach(
        extra => {

            value +=
                Number(extra.precio) || 0;

        }
    );


    return value;

}

/* ============================================================
   EVENTOS
============================================================ */

function bindBuilder(){

    const addLine=
        document.getElementById("addLine");


    if(addLine){

        addLine.addEventListener(
            "click",
            () => {

                const select=
                    document.getElementById(
                        "lineSelect"
                    );


                if(
                    !select ||
                    select.value===""
                ){

                    return;

                }


                const d=data();


                const line=
                    d.lineas[
                        Number(select.value)
                    ];


                /*
                   YOIGO ANTIDIGI

                   1 línea incluida
                   2ª línea = 6 €
                   3ª y siguientes = 9 €
                */

                if(
                    state.company==="yoigo" &&
                    state.base.id==="yganti"
                ){

                    const numero=
                        state.lines.length+2;


                    state.lines.push({

                        id:
                            "yoigo-line-"+Date.now(),

                        nombre:
                            numero===2
                            ? "Línea adicional · 6 €"
                            : "Línea adicional · 9 €",

                        precio:
                            numero===2
                            ? 6
                            : 9

                    });

                }

                else{

                    state.lines.push({

                        id:
                            "line-"+Date.now(),

                        nombre:
                            line.nombre,

                        precio:
                            Number(line.precio)

                    });

                }


                renderContent();

            }
        );

    }


    document
        .querySelectorAll("[data-remove-line]")
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        state.lines.splice(
                            Number(
                                button.dataset.removeLine
                            ),
                            1
                        );

                        renderContent();

                    }
                );

            }
        );


    document
        .querySelectorAll("[data-extra]")
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        const d=data();


                        const extra=
                            d.extras.find(
                                item =>
                                    item.id===
                                    button.dataset.extra
                            );


                        if(!extra)return;


                        /*
                           SEGURIDAD:
                           nunca añadimos un extra
                           que ya esté incluido.
                        */

                        if(
                            state.base.incluye
                                .includes(extra.tipo)
                        ){

                            return;

                        }


                        const index=
                            state.extras.findIndex(
                                item =>
                                    item.id===
                                    extra.id
                            );


                        if(index>=0){

                            state.extras.splice(
                                index,
                                1
                            );

                        }

                        else{

                            state.extras.push({

                                id:extra.id,

                                nombre:

function labelIncluded(type){

    const labels={

        tv:"TV",

        netflix:"Netflix",

        prime:"Prime Video",

        disney:"Disney+",

        hbo:"HBO / Disney+",

        deco:"Decodificador",

        deportes:"Deportes"

    };


    return labels[type]||type;

}


/* ============================================================
   BUSCADOR
============================================================ */

function renderSearch(content){

    const d=data();

    const query=
        state.search
            .trim()
            .toLowerCase();


    let products=[
        ...catalog()
    ];


    d.lineas.forEach(
        line => {

            products.push({

                nombre:
                    "Línea adicional · "+
                    line.nombre,

                precio:
                    line.precio,

                detalle:
                    "Línea adicional"

            });

        }
    );


    d.extras.forEach(
        extra => {

            products.push({

                nombre:
                    extra.nombre,

                precio:
                    extra.precio,

                detalle:
                    extra.detalle,

                tipo:
                    extra.tipo

            });

        }
    );


    const results=
        products.filter(
            product => {

                const text=
                    (
                        product.nombre+
                        " "+
                        (product.detalle||"")
                    ).toLowerCase();


                return text.includes(query);

            }
        );


    content.innerHTML=`

<div class="card">

<h3>
Buscar en ${d.nombre}
</h3>


<div class="results">

${
    results.length

    ?

    results
        .map(
            product => `

<div class="result">

<span class="result-price">

${euro(product.precio)}/mes

</span>

<strong>

${product.nombre}

</strong>

<p>

${product.detalle||""}

</p>

</div>

`
        )
        .join("")

    :

    `

<div class="empty">

No se han encontrado resultados.

</div>

`

}

</div>

</div>

`;

}

function showConditions(){

class="close"
id="close"
>
Cerrar

</div>


${
    d.condiciones
        .map(
            condition => `

<div class="condition">

✓ ${condition}

</div>

`
        )
        .join("")
}


<p class="muted">

Comprueba siempre la documentación vigente
antes de realizar una contratación.

</p>

</div>

`;


    document.body.appendChild(modal);


    modal
        .querySelector("#close")
        .addEventListener(
            "click",
            () => modal.remove()
        );


    modal.addEventListener(
        "click",
        event => {

            if(
                event.target===modal
            ){

                modal.remove();

            }

        }
    );

}
