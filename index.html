<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Configurador Grupo ACERCA</title>

<style>
:root{
  --ink:#171717;
  --muted:#68707d;
  --line:#e5e7eb;
  --bg:#f5f6f8;
  --mm:#f2c400;
  --yg:#b41472;
  --vf:#e60000;
  --lw:#d51f26;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

button,input,select{font:inherit}
button{cursor:pointer}

.container{
  width:min(1180px,calc(100% - 28px));
  margin:auto
}

.header{
  position:sticky;
  top:0;
  z-index:10;
  background:#fff;
  border-bottom:1px solid var(--line)
}

.header-in{
  min-height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between
}

.brand{
  font-weight:950;
  font-size:18px
}

.brand-grupo{color:#ff8600}
.brand-acerca{color:#009ef7}

.btn{
  border:1px solid var(--line);
  background:#fff;
  border-radius:10px;
  padding:10px 13px;
  font-weight:800;
  font-size:13px
}

.primary.mm{
  background:var(--mm);
  border-color:var(--mm)
}

.primary.yg{
  background:var(--yg);
  color:#fff;
  border-color:var(--yg)
}

.primary.vf{
  background:var(--vf);
  color:#fff;
  border-color:var(--vf)
}

.primary.lw{
  background:var(--lw);
  color:#fff;
  border-color:var(--lw)
}

main{padding:28px 0 45px}

.hero{
  text-align:center;
  max-width:800px;
  margin:0 auto 28px
}

.eyebrow{
  font-size:11px;
  font-weight:900;
  letter-spacing:.1em;
  color:var(--muted);
  text-transform:uppercase
}

.hero h1{
  font-size:38px;
  line-height:1.05;
  margin:7px 0
}

.hero p{
  color:var(--muted);
  font-size:14px;
  line-height:1.55
}

.companies{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px
}

.company{
  border:1px solid var(--line);
  border-top:5px solid var(--c);
  border-radius:18px;
  background:#fff;
  padding:21px;
  text-align:left;
  min-height:225px
}

.company.mm{--c:var(--mm)}
.company.yg{--c:var(--yg)}
.company.vf{--c:var(--vf)}
.company.lw{--c:var(--lw)}

.logo{
  font-size:23px;
  font-weight:950;
  margin-bottom:23px
}

.mm .logo span{
  background:var(--mm);
  padding:2px 6px;
  border-radius:5px
}

.yg .logo,
.vf .logo,
.lw .logo{
  color:var(--c)
}

.company h2{
  font-size:18px;
  margin:0 0 7px
}

.company p{
  font-size:12px;
  line-height:1.5;
  color:var(--muted);
  margin:0
}

.go{
  margin-top:18px;
  font-size:12px;
  font-weight:900;
  color:var(--c)
}

.workspace-head{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:15px
}

.company-title{
  font-size:24px;
  font-weight:950;
  margin-right:auto
}

.company-title.mm{color:#111}
.company-title.yg{color:var(--yg)}
.company-title.vf{color:var(--vf)}
.company-title.lw{color:var(--lw)}

.search{
  width:100%;
  padding:13px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#fff;
  margin-bottom:13px
}

.tabs{
  display:flex;
  gap:7px;
  overflow:auto;
  margin-bottom:17px
}

.tab{
  white-space:nowrap;
  border:1px solid var(--line);
  background:#fff;
  border-radius:999px;
  padding:9px 14px;
  font-size:12px;
  font-weight:850
}

.tab.active{
  background:#111;
  color:#fff
}

.tab.active.yg{background:var(--yg)}
.tab.active.vf{background:var(--vf)}
.tab.active.lw{background:var(--lw)}

.layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 360px;
  gap:17px;
  align-items:start
}

.card,
.summary{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:17px;
  margin-bottom:13px
}

.summary{
  position:sticky;
  top:80px
}

.summary.mm{border-top:6px solid var(--mm)}
.summary.yg{border-top:6px solid var(--yg)}
.summary.vf{border-top:6px solid var(--vf)}
.summary.lw{border-top:6px solid var(--lw)}

h3{
  font-size:15px;
  margin:0 0 13px
}

.label{
  font-size:10px;
  font-weight:900;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.05em;
  margin:13px 0 7px
}

.select{
  width:100%;
  padding:11px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#fff
}

.options{
  display:grid;
  gap:8px
}

.option{
  width:100%;
  text-align:left;
  background:#fff;
  border:1px solid var(--line);
  border-radius:11px;
  padding:12px
}

.option.selected{
  border:2px solid #111;
  padding:11px
}

.option.selected.yg{border-color:var(--yg)}
.option.selected.vf{border-color:var(--vf)}
.option.selected.lw{border-color:var(--lw)}

.option strong{font-size:12px}

.price{
  float:right;
  font-weight:950
}

.detail{
  font-size:10.5px;
  color:var(--muted);
  line-height:1.45;
  margin-top:4px
}

.badge{
  display:inline-block;
  background:#f1f2f4;
  border-radius:999px;
  padding:4px 7px;
  font-size:9px;
  font-weight:900;
  margin-top:7px
}

.included,
.chosen{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px;
  margin-top:7px
}

.included strong,
.chosen strong{
  font-size:11px
}

.included small{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-top:2px
}

.pill{
  background:#f1f2f4;
  border-radius:999px;
  padding:5px 7px;
  font-size:9px;
  font-weight:900
}

.addline{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px
}

.chosen span{
  font-size:11px;
  font-weight:900
}

.remove{
  border:0;
  background:#f1f2f4;
  border-radius:7px;
  padding:6px 8px;
  font-size:10px;
  font-weight:800
}

.break{
  background:#fafafa;
  border-radius:10px;
  padding:10px;
  margin:10px 0
}

.row{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  padding:4px 0
}

.row.total{
  border-top:1px solid var(--line);
  margin-top:5px;
  padding-top:8px;
  font-weight:950
}

.pricebox{
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  padding:14px 0
}

.muted{color:var(--muted)}

.big{
  font-size:35px;
  font-weight:950
}

.after{
  font-size:13px;
  font-weight:850;
  margin-top:4px
}

.summary ul{
  list-style:none;
  padding:0;
  margin:12px 0
}

.summary li{
  font-size:11px;
  padding:7px 0;
  border-bottom:1px solid #f0f0f0;
  line-height:1.45
}

.alert{
  background:#f5f6f8;
  border-radius:9px;
  padding:9px;
  font-size:10px;
  line-height:1.45;
  margin:10px 0
}

.actions{
  display:grid;
  gap:8px
}

.block{width:100%}

.results{
  display:grid;
  gap:8px
}

.result{
  border:1px solid var(--line);
  border-radius:11px;
  padding:12px
}

.result strong{font-size:12px}

.result p{
  font-size:10px;
  color:var(--muted);
  margin:5px 0 0
}

.result .price{
  font-size:12px
}

.empty{
  border:1px dashed #c8ccd2;
  border-radius:11px;
  padding:27px;
  text-align:center;
  color:var(--muted);
  font-size:12px
}

.client{
  max-width:560px;
  margin:15px auto
}

.client-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:21px;
  padding:25px
}

.client-card h1{
  font-size:28px;
  margin:6px 0 18px
}

.client-price{
  font-size:43px;
  font-weight:950
}

.client-item{
  font-size:12px;
  padding:10px 0;
  border-bottom:1px solid var(--line)
}

.client-note{
  background:#f5f6f8;
  border-radius:10px;
  padding:10px;
  font-size:10px;
  line-height:1.5;
  margin-top:14px
}

.modal-bg{
  position:fixed;
  inset:0;
  background:#0007;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px
}

.modal{
  background:#fff;
  border-radius:17px;
  padding:26px;
  width:min(620px,100%);
  max-height:90vh;
  overflow:auto;
  box-shadow:0 24px 70px #0005
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.condition{
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px;
  font-size:11px;
  line-height:1.45;
  margin-top:8px
}

.private-modal{
  width:min(500px,100%);
  text-align:left
}

.private-modal h2{
  margin:0 0 10px;
  font-size:22px
}

.private-modal p{
  font-size:13px;
  line-height:1.6;
  color:var(--muted);
  margin:0 0 20px
}

.private-modal .important{
  font-size:14px;
  line-height:1.55
}

.private-modal .modal-actions{
  display:flex;
  justify-content:flex-end
}

.private-modal .accept{
  min-width:110px
}

@media(max-width:900px){
  .companies{
    grid-template-columns:repeat(2,1fr)
  }

  .layout{
    grid-template-columns:1fr
  }

  .summary{
    position:static
  }
}

@media(max-width:560px){
  .companies{
    grid-template-columns:1fr
  }

  .company{
    min-height:auto
  }

  .addline{
    grid-template-columns:1fr
  }

  .hero h1{
    font-size:29px
  }

  .container{
    width:calc(100% - 18px)
  }
}
</style>
</head>

<body>
<div id="app"></div>

<script>
const DATA={

mm:{
  name:'MásMóvil',

  conditions:[

    'No se puede ofrecer terminal en altas nuevas ni en altas nuevas procedentes de prepago.'
  ],

  bases:[
    ['50 GB compartidos',34.90,44.90,2,'Tarifa base · Fibra 1 Gb + fijo + 2 líneas'],
    ['100 GB compartidos',39.90,49.90,2,'Tarifa base · Fibra 1 Gb + fijo + 2 líneas'],
    ['200 GB compartidos',46.90,56.90,2,'Tarifa base · Fibra 1 Gb + fijo + 2 líneas']
  ],

  digi:[
    ['50 GB compartidos · Digi',19.90,29.90,2,'Procedente de Digi · Fibra 1 Gb + fijo'],
    ['100 GB compartidos · Digi',24.90,34.90,2,'Procedente de Digi · Fibra 1 Gb + fijo'],
    ['200 GB compartidos · Digi',31.90,41.90,2,'Procedente de Digi · Fibra 1 Gb + fijo']
  ],

  vodafone:[
    ['100 GB compartidos · Grupo Vodafone',29.90,39.90,2,'Precio especial · Grupo Vodafone · Fibra 1 Gb + fijo'],
    ['200 GB compartidos · Grupo Vodafone',36.90,46.90,2,'Precio especial · Grupo Vodafone · Fibra 1 Gb + fijo']
  ],

  twoP:[
    ['Fijo + Fibra 500 Mb',24.90,null,0,'2P · 5 € de descuento durante 12 meses'],
    ['Fijo + Fibra 1 Gb',34.90,null,0,'2P · 5 € de descuento durante 12 meses']
  ],

  lines:[
    ['25 GB',5],
    ['45 GB',10],
    ['100 GB',12]
  ],

  extras:[
    ['Fibra adicional · 500 Mb',14.90,'Permanencia 12 meses · penalización 200 €'],
    ['Fibra adicional · 1 Gb',24.90,'Permanencia 12 meses · penalización 200 €']
  ]
},

yg:{
  name:'Yoigo',
  cls:'yg',

  conditions:[
    'TRY & BUY: Fibra 1 Gb al precio de 600 Mb durante los 3 primeros meses. Después, +10 €/mes.',
    'Válido para portabilidades desde prepago y pospago.',
    'Permanencia de 12 meses cuando exista descuento aplicado.',
    'Penalización por incumplimiento: 160 €.'
  ],

  bases:[
    ['50 GB compartidos',49,59,2,'Fibra 1 Gb + fijo + 2 líneas'],
    ['80 GB compartidos',41,51,2,'Fibra 1 Gb + fijo + 2 líneas'],
    ['GB ilimitados',49,59,2,'Fibra 1 Gb + fijo + 2 líneas'],
    ['GB ilimitados + TV + Netflix',47,57,2,'Fibra 1 Gb + fijo + 2 líneas + TV + Netflix']
  ],

  more:[
    ['GB ilimitados + TV + 3 plataformas',57,67,2,'A los 6 meses: 97 € · con 600 Mb: 87 €']
  ],

  antidigi:[
    ['Antidigi · Fibra 1 Gb + 1 línea GB ilimitados',25,35,1,'2.ª línea 6 € · desde la 3.ª 9 €']
  ],

  /*
    En el tarifario facilitado las tarifas aparecen como
    PRECIO GENERAL y no se identifica ninguna como precio
    especial procedente de Digi.
  */
  digi:[],

  twoP:[
    ['Fijo + Fibra 600 Mb',19.90,29.90,0,'2P · 3 primeros meses'],
    ['Fijo + Fibra 1 Gb',19.90,29.90,0,'2P · 3 primeros meses']
  ],

  lines:[
    ['Línea adicional',9]
  ],

  extras:[
    ['Fibra adicional · 600 Mb',14.90,'Precio mensual'],
    ['Fibra adicional · 1 Gb',14.90,'3 meses · después 24,90 € · permanencia 12 meses'],
    ['Netflix',8,'Plataforma'],
    ['HBO / Disney',6,'Plataforma'],
    ['Prime Video',4,'Plataforma']
  ]
},

vf:{
  name:'Vodafone',
  cls:'vf',

  conditions:[
    'Precios con IVA incluido.',
    'Las ofertas privadas y Vodafone One tienen condiciones específicas.',
    'En las tarifas de TV existen evoluciones de precio indicadas en el tarifario.'
  ],

  bases:[
    ['Fibra 1 Gb + 1 línea 60 GB',30.10,37.10,1,'Oferta privada'],
    ['Fibra 1 Gb + 1 línea 160 GB',33.60,40.60,1,'Oferta privada'],
    ['Fibra 1 Gb + 1 línea GB ilimitados',37.10,44.10,1,'Oferta privada'],

    ['Fibra 1 Gb + 1 línea 60 GB + TV + Netflix/Prime',43,54,1,'Oferta Vodafone'],
    ['Fibra 1 Gb + 1 línea 160 GB + TV + Netflix + Prime',48,59,1,'Oferta Vodafone'],
    ['Fibra 1 Gb + 1 línea 160 GB + TV + Prime + Disney+',54,65,1,'Oferta Vodafone'],
    ['Fibra 1 Gb + 1 línea 160 GB + TV + Prime + Disney+',59,70,1,'Oferta Vodafone']
  ],

  twoP:[
    ['Fijo + Fibra 600 Mb',30,null,0,'2P'],
    ['Fijo + Fibra 1 Gb',35,null,0,'2P']
  ],

  lines:[
    ['Línea adicional',6]
  ],

  extras:[
    ['TV Vodafone',5,'Incluye deportes'],
    ['Netflix',8,'Plataforma'],
    ['HBO',6,'Plataforma'],
    ['Disney+',7,'Plataforma'],
    ['Prime Video',5,'Plataforma'],
    ['Decodificador TV',3,'Gratis en las tarifas de 160 GB / ilimitados según tarifario']
  ]
},

lw:{
  name:'Lowi',
  cls:'lw',

  conditions:[
    'Precios con IVA incluido.',
    'Fibra 1 Gb + 2 líneas 300 GB + TV obligatoria: 28 €/mes.',
    'Antidigi: Fibra 1 Gb + 2 líneas 300 GB + TV obligatoria: 25 €/mes.',
    'Tarifa principal: 3 meses de permanencia. Antidigi: 12 meses.'
  ],

  bases:[
    ['Fibra 1 Gb + 2 líneas 300 GB + TV',28,28,2,'TV obligatoria · 3 meses de permanencia'],
    ['Antidigi · Fibra 1 Gb + 2 líneas 300 GB + TV',25,25,2,'TV obligatoria · 12 meses de permanencia']
  ],

  lines:[
    ['10 GB',4],
    ['50 GB',5],
    ['100 GB',8],
    ['150 GB',10],
    ['300 GB',12]
  ],

  extras:[
    ['Lowi TV',5,'TV'],
    ['Deportes',1,'Extra sobre el paquete TV'],
    ['Netflix',8,'Plataforma'],
    ['HBO',6,'Plataforma'],
    ['Disney+',3.99,'Plataforma'],
    ['Prime Video',4,'Plataforma']
  ]
}
};

const S={
  company:null,
  tab:'config',
  base:null,
  lines:[],
  extras:[],
  search:'',
  digi:false,
  vodafone:false,
  ygDigi:false,
  client:false
};

const app=document.getElementById('app');

const eur=n=>
  Number(n).toLocaleString('es-ES',{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  })+' €';

const esc=s=>
  String(s).replace(
    /[&<>"']/g,
    c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );

function reset(){
  S.base=null;
  S.lines=[];
  S.extras=[];
  S.search='';
  S.digi=false;
  S.vodafone=false;
  S.ygDigi=false;
  S.client=false;
}

function card(c,title,sub,desc){
  const d=DATA[c];

  return `
    <button class="company ${d.cls}" data-c="${c}">
      <div class="logo">
        ${title||d.name}
        ${sub?` <span>${sub}</span>`:''}
      </div>

      <h2>${esc(d.name)}</h2>

      <p>${esc(desc)}</p>

      <div class="go">
        Construir tarifa →
      </div>
    </button>
  `;
}

function home(){

  app.innerHTML=`

    <header class="header">
      <div class="container header-in">
        <div class="brand">
          <span class="brand-grupo">Grupo</span>
          <span class="brand-acerca">ACERCA</span>
        </div>
      </div>
    </header>

    <main>
      <div class="container">

        <div class="hero">
          <div class="eyebrow">
            Herramienta para comerciales
          </div>

          <h1>
            Constructor de tarifas
          </h1>

          <p>
            Elige una compañía y construye la oferta desde la tarifa base.
            Añade líneas y extras y el precio se recalcula automáticamente.
          </p>
        </div>

        <div class="companies">

          ${card(
            'mm',
            'MÁS',
            'MÓVIL',
            'Convergentes, Digi, Grupo Vodafone, 2P, líneas y fibra adicional.'
          )}

          ${card(
            'yg',
            '',
            '',
            'Convergentes, ilimitados, TV, plataformas y líneas.'
          )}

          ${card(
            'vf',
            'vodafone',
            '',
            'Ofertas privadas, Vodafone One, 2P, TV y plataformas.'
          )}

          ${card(
            'lw',
            'Lowi',
            '',
            'Convergentes, Antidigi, TV, deportes y líneas.'
          )}

        </div>

      </div>
    </main>
  `;

  document
    .querySelectorAll('[data-c]')
    .forEach(
      x=>x.onclick=()=>{
        open(x.dataset.c)
      }
    );
}

function open(c){
  S.company=c;
  S.tab='config';
  reset();
  workspace();
}

function workspace(){

  if(S.client){
    client();
    return;
  }

  const d=DATA[S.company];

  app.innerHTML=`

    <header class="header">
      <div class="container header-in">

        <div class="brand">
          <span class="brand-grupo">Grupo</span>
          <span class="brand-acerca">ACERCA</span>
        </div>

        <button class="btn" id="back">
          ← Compañías
        </button>

      </div>
    </header>

    <main>

      <div class="container">

        <div class="workspace-head">

          <div class="company-title ${d.cls}">
            ${d.name}
          </div>

          <button class="btn" id="conditions">
            Condiciones
          </button>

        </div>

        <input
          class="search"
          id="search"
          type="search"
          placeholder="🔎 Buscar tarifas, fibra, GB, TV..."
          value="${esc(S.search)}"
        >

        <div class="tabs">

          <button
            class="tab ${S.tab==='config'?'active':''} ${d.cls}"
            data-tab="config">
            Configurador
          </button>

          <button
            class="tab ${S.tab==='search'?'active':''} ${d.cls}"
            data-tab="search">
            Buscar tarifas
          </button>

          <button
            class="tab ${S.tab==='extras'?'active':''} ${d.cls}"
            data-tab="extras">
            Extras
          </button>

        </div>

        <div id="content"></div>

      </div>

    </main>
  `;

  document.getElementById('back').onclick=()=>{
    S.company=null;
    reset();
    home();
  };

  document.getElementById('conditions').onclick=conditions;

  document.getElementById('search').oninput=e=>{
    S.search=e.target.value;

    if(S.search.trim()){
      S.tab='search';
      renderTab();
    }
  };

  document
    .querySelectorAll('[data-tab]')
    .forEach(
      b=>b.onclick=()=>{
        S.tab=b.dataset.tab;
        renderTab();
      }
    );

  renderTab();
}

function catalog(){

  const d=DATA[S.company];

  let a=[];

  if(S.company==='mm'){
    if(S.digi){
      a=d.digi;
    }
    else if(S.vodafone){
      a=d.vodafone;
    }
    else{
      a=d.bases;
    }
  }

  else if(S.company==='yg'){
    a=S.ygDigi && d.digi?.length
      ?d.digi
      :d.bases;
  }

  else{
    a=d.bases;
  }

  a=[...a];

  if(d.more)
    a.push(...d.more);

  if(d.antidigi)
    a.push(...d.antidigi);

  if(d.twoP)
    a.push(...d.twoP);

  return a;
}

function renderTab(){

  const c=document.getElementById('content');

  if(!c)return;

  if(S.tab==='config')
    config(c);

  else if(S.tab==='search')
    search(c);

  else
    extras(c);
}

function id(x){
  return S.company+
    '|'+x[0]+
    '|'+x[1]+
    '|'+(x[2]??'');
}

function includedExtras(){

  if(!S.base)
    return [];

  const n=S.base[0].toLowerCase();

  if(S.company==='vf'){

    const a=[];

    if(n.includes('tv'))
      a.push('TV Vodafone');

    if(n.includes('netflix'))
      a.push('Netflix');

    if(n.includes('prime'))
      a.push('Prime Video');

    if(n.includes('disney'))
      a.push('Disney+');

    if(
      n.includes('160 gb') ||
      n.includes('gb ilimitados')
    )
      a.push('Decodificador TV');

    return a;
  }

  if(S.company==='yg'){

    const a=[];

    if(n.includes('tv'))
      a.push('TV');

    if(n.includes('netflix'))
      a.push('Netflix');

    if(n.includes('3 plataformas')){
      a.push('HBO / Disney');
      a.push('Prime Video');
    }

    return a;
  }

  if(
    S.company==='lw' &&
    n.includes('tv')
  )
    return ['Lowi TV'];

  return [];
}

          ${

              .map(
                (x,i)=>`

                  <div class="chosen">

                    <strong>
                      📱 ${esc(x.name)}
                    </strong>

                    <span>

                      +${eur(x.price)}

                      <button

                        Quitar
                      </button>

                    </span>

                  </div>

                `
              )
              .join('')

        `
        :''

    </div>

    <div class="card">

      <h3>
        3. Añadir extras
      </h3>

      ${

function total(){

  return (
    S.base?.[1]||0
  )
  +
  S.lines.reduce(
    (a,x)=>a+x.price,
    0
  )
  +
  S.extras.reduce(
    (a,x)=>a+x.price,
    0
  );
}

function after(){

  if(
    !S.base ||
    S.base[2]==null
  )
    return null;

  return S.base[2]
    +
    S.lines.reduce(
      (a,x)=>a+x.price,
      0
    )
    +
    S.extras.reduce(
      (a,x)=>a+x.price,
      0
    );
}

          <b>${eur(S.base[1])}</b>

          :''

          }
          incluida${S.base[3]!==1?'s':''}

          ${

            ?

  `;

  document.getElementById('client').onclick=()=>{
    S.client=true;
    client();
  };

  document.getElementById('reset').onclick=()=>{
    reset();
    renderTab();
  };

  bindSummaryButtons();
}

function bindSummaryButtons(){}

function bind(){

  document
    .getElementById('add')
    ?.addEventListener(
      'click',
      ()=>{

        const s=
          document.getElementById('line');

        if(!s.value)
          return;

        const x=
          DATA[S.company].lines[+s.value];

        S.lines.push({
          name:x[0],
          price:+x[1]
        });

        renderTab();
      }
    );

  document
    .querySelectorAll('[data-r]')
    .forEach(
      b=>b.onclick=()=>{
        S.lines.splice(
          +b.dataset.r,
          1
        );

        renderTab();
      }
    );

  document
    .querySelectorAll('[data-e]')
    .forEach(
      b=>b.onclick=()=>{

        const d=DATA[S.company];

        const included=
          includedExtras();

        const available=
          (d.extras||[])
            .filter(
              x=>!included.includes(x[0])
            );

        const x=
          available[+b.dataset.e];

        if(!x)
          return;

        const i=
          S.extras.findIndex(
            e=>e.name===x[0]
          );

        if(i>=0)
          S.extras.splice(i,1);

        else
          S.extras.push({
            name:x[0],
            price:+x[1]
          });

        renderTab();
      }
    );
}

function search(c){

  const q=
    S.search.trim().toLowerCase();

  const d=
    DATA[S.company];

  let p=[
    ...catalog(),

    ...(d.lines||[])

        x=>[
          'Línea adicional · '+x[0],
          x[1],
          null,
          0,
          'Línea adicional'
        ]
      ),

    ...(d.extras||[])
      .map(
        x=>[
          x[0],
          x[1],
          null,
          0,
          x[2]
        ]
      )
  ];

  p=
    p.filter(
      x=>
        (
          x[0]+' '+x[4]
        )
        .toLowerCase()
        .includes(q)
    );

  c.innerHTML=`

    <div class="card">

      <h3>

      <div class="results">

          p.length

          `
            <div class="empty">
              No se han encontrado resultados.
