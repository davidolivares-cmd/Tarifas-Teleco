const S={company:null,tab:'config',base:null,lines:[],extras:[],search:'',origin:'base',ygDigi:false,client:false};
const app=document.getElementById('app');
const toastEl=document.getElementById('toast');
const euro=n=>Number(n).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iconFor=name=>{const n=name.toLowerCase();if(n.includes('fibra'))return'📶';if(n.includes('línea'))return'📱';if(n.includes('tv'))return'📺';if(n.includes('netflix'))return'🎬';if(n.includes('prime'))return'🎁';if(n.includes('disney'))return'✨';return'➕'};

function showToast(text){toastEl.textContent=text;toastEl.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toastEl.classList.remove('show'),2300)}
function resetConfig(){S.base=null;S.lines=[];S.extras=[];S.search='';S.origin='base';S.ygDigi=false;S.client=false}
function companyCard(c,title,sub,desc){const d=DATA[c];return `<button class="company ${d.cls}" data-company="${c}"><div class="logo">${title||d.name}${sub?` <span>${sub}</span>`:''}</div><h2>${esc(d.name)}</h2><p>${esc(desc)}</p><div class="go">Construir tarifa →</div></button>`}
function home(){app.innerHTML=`<header class="header"><div class="container header-in"><div class="brand"><span class="brand-grupo">Grupo</span> <span class="brand-acerca">ACERCA</span></div></div></header><main><div class="container"><div class="hero"><div class="eyebrow">Herramienta para comerciales</div><h1>Constructor de tarifas</h1><p>Construye una oferta en pocos pasos, comprueba automáticamente lo que incluye cada tarifa y genera una propuesta lista para enseñar al cliente.</p></div><div class="companies">${companyCard('mm','MÁS','MÓVIL','Convergentes, precios especiales Digi y Grupo Vodafone, 2P, líneas y fibra adicional.')} ${companyCard('yg','','','Convergentes, ilimitados, TV, plataformas, Antidigi y líneas.')} ${companyCard('vf','vodafone','','Ofertas privadas, Vodafone One, 2P, TV, plataformas y líneas.')} ${companyCard('lw','Lowi','','Convergentes, Antidigi, TV, deportes, plataformas y líneas.')}</div></div></main>`;document.querySelectorAll('[data-company]').forEach(b=>b.onclick=()=>openCompany(b.dataset.company))}
function openCompany(c){S.company=c;S.tab='config';resetConfig();workspace()}
function headerHTML(d){return `<header class="header"><div class="container header-in"><div class="brand"><span class="brand-grupo">Grupo</span> <span class="brand-acerca">ACERCA</span></div><button class="btn" id="back">← Compañías</button></div></header>`}
function workspace(){if(S.client){clientView();return}const d=DATA[S.company];app.innerHTML=headerHTML(d)+`<main><div class="container"><div class="workspace-head"><div class="company-title ${d.cls}">${esc(d.name)}</div><button class="btn" id="conditions">Condiciones</button></div><input class="search" id="search" type="search" placeholder="🔎 Buscar tarifa, fibra, GB, TV..." value="${esc(S.search)}"><div class="tabs"><button class="tab ${S.tab==='config'?'active':''} ${d.cls}" data-tab="config">Configurador</button><button class="tab ${S.tab==='search'?'active':''} ${d.cls}" data-tab="search">Buscar tarifas</button><button class="tab ${S.tab==='extras'?'active':''} ${d.cls}" data-tab="extras">Extras</button></div><div id="content"></div></div></main>`;document.getElementById('back').onclick=()=>{S.company=null;resetConfig();home()};document.getElementById('conditions').onclick=conditions;document.getElementById('search').oninput=e=>{S.search=e.target.value;if(S.search.trim()){S.tab='search';renderTab()}else{S.tab='config';renderTab()}};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;renderTab()});renderTab()}
function allBases(includeSpecial=true){const d=DATA[S.company];let a=[];if(S.company==='mm'){a=S.origin==='digi'?d.digi:S.origin==='vodafone'?d.vodafone:d.bases}else if(S.company==='yg'){a=d.bases}else a=d.bases;const out=[...a,...(d.more||[]),...(d.twoP||[])];if(includeSpecial)out.push(...(d.antidigi||[]));return out}
function baseById(id){const d=DATA[S.company];if(S.company==='yg'&&d.antidigi?.some(x=>x.id===id))return d.antidigi.find(x=>x.id===id);return allBases().find(x=>x.id===id)}
function sourceLabel(base){if(base.source==='private')return'Oferta privada';if(base.source==='digi')return'Precio especial · Digi';if(base.source==='vodafone')return'Precio especial · Grupo Vodafone';if(base.source==='antidigi')return'Antidigi';if(base.source==='2p')return'2P';return'Precio general'}
function sourceBadge(base){const label=sourceLabel(base);let cls='';if(base.private)cls='private';else if(base.source==='digi')cls='special';else if(base.source==='vodafone')cls='vod';return `<span class="badge ${cls}">${base.private?'⚠️ ':''}${esc(label)}</span>`}
function tariffCard(base){const d=DATA[S.company];const isAnti=base.source==='antidigi';const selected=S.base?.id===base.id;return `<button class="option ${selected?'selected':''} ${d.cls} ${base.private?'private':''} ${isAnti?'antidigi-card':''}" data-base="${esc(base.id)}"><div><strong>${esc(base.name)}</strong><span class="price">${euro(base.price)}/mes</span><span class="selected-mark">✓ SELECCIONADA</span></div><div class="detail">${esc(base.note||sourceLabel(base))}${base.after!=null?` · Después: ${euro(base.after)}/mes`:''}</div><div class="tariff-meta">${(base.tags||[]).slice(0,6).map(t=>`<span class="meta-pill">${esc(t)}</span>`).join('')}</div>${sourceBadge(base)}</button>`}
function config(c){const d=DATA[S.company];const bases=S.company==='yg'?allBases(false):allBases();const specialAntidigi=S.company==='yg'?(d.antidigi||[]):[];const optionCount=bases.length+specialAntidigi.length;c.innerHTML=`<div class="layout"><div><div class="card"><div class="section-top"><h3><span class="step">1</span>Elige la tarifa base</h3><span class="tiny muted">${optionCount} opciones</span></div>${S.company==='mm'?`<div class="label">Procedencia del cliente</div><select class="select" id="origin"><option value="base" ${S.origin==='base'?'selected':''}>Tarifa base</option><option value="digi" ${S.origin==='digi'?'selected':''}>Precio especial · Digi</option><option value="vodafone" ${S.origin==='vodafone'?'selected':''}>Precio especial · Grupo Vodafone</option></select>`:''}${S.company==='yg'?`<div class="label">Procedencia del cliente</div><select class="select" id="ygorigin"><option value="base" selected>Tarifa base</option><option value="digi" disabled>Procedente de Digi · precio especial</option></select><div class="detail">La opción Digi se mantiene separada porque el tarifario facilitado no identifica una tarifa Yoigo con precio especial de Digi.</div>`:''}<div class="label">Tarifas disponibles</div><div class="options">${bases.map(tariffCard).join('')}</div>${specialAntidigi.length?`<div class="label">Tarifas especiales</div><div class="options">${specialAntidigi.map(tariffCard).join('')}</div>`:''}</div>${S.base?builder():`<div class="card"><div class="empty">Selecciona una tarifa base para continuar. Después podrás añadir líneas, extras y preparar la oferta para el cliente.</div></div>`}</div><aside id="summary"></aside></div>`;document.getElementById('origin')?.addEventListener('change',e=>{S.origin=e.target.value;S.base=null;S.lines=[];S.extras=[];renderTab()});document.querySelectorAll('[data-base]').forEach(b=>b.onclick=()=>selectBase(b.dataset.base));summary()}
function compatibleExtrasForBase(base,extras){const previousBase=S.base;const keepBase=S.base;S.base={...base};const allowed=new Set((DATA[S.company].extras||[]).filter(x=>!isIncluded(x)).map(x=>x.id));S.base=keepBase;return extras.filter(x=>allowed.has(x.id))}
function selectBase(id){const selected=baseById(id);if(!selected)return;const apply=()=>{const previousLines=S.lines.map(x=>({...x}));const previousExtras=S.extras.map(x=>({...x}));S.base={...selected};S.client=false;S.extras=compatibleExtrasForBase(selected,previousExtras);S.lines=previousLines;if(S.company==='yg'&&S.base.source==='antidigi'){S.lines=S.lines.map((line,i)=>({...line,price:i===0?6:9}))}else if(S.company==='yg'){S.lines=S.lines.map(line=>{const src=DATA.yg.lines.find(x=>x.name===line.name)||DATA.yg.lines[0];return {...line,price:src.price}})}renderTab();showToast('✓ Tarifa cambiada manteniendo la configuración compatible');setTimeout(()=>{const builderCard=document.querySelector('#content .card[data-builder]');if(builderCard)builderCard.scrollIntoView({behavior:'smooth',block:'start'})},70)};if(selected.private)showPrivateModal(apply);else apply()}
function includedExtras(){if(!S.base)return[];const b=S.base;const out=[];if(b.tvMandatory||b.tv)out.push(S.company==='lw'?'Lowi TV':'TV Vodafone');if(b.netflix)out.push('Netflix');if(b.prime)out.push('Prime Video');if(b.disney)out.push('Disney+');if(b.decoder)out.push('Decodificador TV');if(S.company==='yg'&&b.hbo)out.push('HBO / Disney');return out}
function isIncluded(extra){return includedExtras().some(x=>x.toLowerCase()===extra.name.toLowerCase())}
function availableExtras(){return (DATA[S.company].extras||[]).filter(x=>!isIncluded(x))}
function lineUnitPrice(line){if(S.company==='yg'&&S.base?.source==='antidigi'){const n=S.lines.length+2;return n===2?6:9}return line.price}
function addLine(){const s=document.getElementById('line');if(!s||!s.value)return;const x=DATA[S.company].lines.find(y=>y.id===s.value);if(!x)return;S.lines.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),name:x.name,price:lineUnitPrice(x)});renderTab();showToast('✓ Línea añadida')}
function changeLine(index,delta){const x=S.lines[index];if(!x)return;if(delta>0){const source=DATA[S.company].lines.find(y=>y.name===x.name)||DATA[S.company].lines[0];const price=lineUnitPrice(source);S.lines.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),name:source.name,price});showToast('✓ Línea añadida')}else{S.lines.splice(index,1);showToast('Línea eliminada')}if(S.company==='yg'&&S.base?.source==='antidigi'){S.lines=S.lines.map((line,i)=>({...line,price:i===0?6:9}))}else if(S.company==='yg'){S.lines=S.lines.map(line=>{const src=DATA.yg.lines.find(y=>y.name===line.name)||DATA.yg.lines[0];return {...line,price:src.price}})}renderTab()}
function builder(){const d=DATA[S.company];const inc=includedExtras();const extras=availableExtras();return `<div class="card" data-builder><div class="section-top"><h3><span class="step">2</span>Líneas incluidas y adicionales</h3><span class="tiny muted">${S.base.lines||0} incluidas</span></div>${Array.from({length:S.base.lines||0}).map((_,i)=>`<div class="included"><div><strong>📱 Línea ${i+1}</strong><small>Incluida en la tarifa base${S.base.shared?` · ${esc(S.base.shared)}`:''}</small></div><span class="pill">INCLUIDA</span></div>`).join('')}${!S.base.lines?`<div class="empty" style="padding:15px;margin-top:8px">Esta tarifa no incluye líneas móviles.</div>`:''}<div class="label">Añadir línea adicional</div><div class="addline"><select class="select" id="line"><option value="">Selecciona el tipo de línea...</option>${(d.lines||[]).map(x=>`<option value="${esc(x.id)}">${esc(x.name)} · +${euro(x.price)}/mes</option>`).join('')}</select><button class="btn primary ${d.cls}" id="addLine">+ Añadir</button></div>${S.company==='yg'&&S.base.source==='antidigi'?`<div class="detail" style="margin-top:8px"><b>Antidigi:</b> 2.ª línea +6,00 €/mes · desde la 3.ª +9,00 €/mes.</div>`:''}${S.lines.length?`<div class="label">Líneas añadidas</div>${S.lines.map((x,i)=>`<div class="chosen"><div><strong>📱 ${esc(x.name)}</strong><div class="detail">+${euro(x.price)}/mes</div></div><div class="line-controls"><div class="counter"><button data-line-minus="${i}" aria-label="Quitar una línea">−</button><span>1</span><button data-line-plus="${i}" aria-label="Añadir otra línea">+</button></div><button class="remove" data-line-remove="${i}">Quitar</button></div></div>`).join('')}`:''}</div><div class="card"><div class="section-top"><h3><span class="step">3</span>Extras</h3><span class="tiny muted">${inc.length} incluidos</span></div>${inc.length?`<div class="label">Incluidos automáticamente</div>${inc.map(name=>`<div class="included"><div><strong>${iconFor(name)} ${esc(name)}</strong><small>Incluido en la tarifa base</small></div><span class="pill status-ok">INCLUIDO</span></div>`).join('')}`:''}<div class="label">Puedes añadir</div><div class="options">${extras.map(x=>{const selected=S.extras.some(e=>e.id===x.id);return `<button class="option extra-card ${selected?'selected':''} ${d.cls}" data-extra="${esc(x.id)}"><strong>${iconFor(x.name)} ${esc(x.name)}<span class="price">+${euro(x.price)}/mes</span></strong><div class="detail">${esc(x.note||'Extra disponible')}</div><span class="badge">${selected?'✓ Añadido':'Añadir a la oferta'}</span></button>`}).join('')}</div></div>`}
function bindBuilder(){document.getElementById('addLine')?.addEventListener('click',addLine);document.querySelectorAll('[data-line-minus]').forEach(b=>b.onclick=()=>changeLine(+b.dataset.lineMinus,-1));document.querySelectorAll('[data-line-plus]').forEach(b=>b.onclick=()=>changeLine(+b.dataset.linePlus,1));document.querySelectorAll('[data-line-remove]').forEach(b=>b.onclick=()=>{S.lines.splice(+b.dataset.lineRemove,1);renderTab();showToast('Línea eliminada')});document.querySelectorAll('[data-extra]').forEach(b=>b.onclick=()=>toggleExtra(b.dataset.extra));}
function toggleExtra(id){const x=availableExtras().find(e=>e.id===id);if(!x)return;const i=S.extras.findIndex(e=>e.id===id);if(i>=0){S.extras.splice(i,1);showToast('Extra eliminado')}else{S.extras.push({id:x.id,name:x.name,price:x.price});showToast('✓ Extra añadido')}renderTab()}
function total(){return(S.base?.price||0)+S.lines.reduce((a,x)=>a+x.price,0)+S.extras.reduce((a,x)=>a+x.price,0)}
function after(){if(!S.base||S.base.after==null)return null;return S.base.after+S.lines.reduce((a,x)=>a+x.price,0)+S.extras.reduce((a,x)=>a+x.price,0)}
function summary(){const box=document.getElementById('summary');if(!box)return;const d=DATA[S.company];if(!S.base){box.innerHTML=`<div class="summary ${d.cls}"><h3>RESUMEN DE LA OFERTA</h3><div class="empty">Selecciona una tarifa base para empezar.</div></div>`;return}const t=total(),a=after(),lt=S.lines.reduce((s,x)=>s+x.price,0),et=S.extras.reduce((s,x)=>s+x.price,0),inc=includedExtras();box.innerHTML=`<div class="summary ${d.cls}"><div class="section-top"><h3>RESUMEN DE LA OFERTA</h3><span class="tiny status-ok">✓ Configuración</span></div>${S.base.private?`<div class="private-strip">🔴 <b>OFERTA PRIVADA</b><br>Venta puntual · Recuerda consultar con tu coordinador.</div>`:''}<div class="pricebox"><div class="muted tiny">${S.base.after!=null?'Precio promocional':'Precio mensual'}</div><div class="big">${euro(t)} <span style="font-size:11px">/mes</span></div>${a!=null?`<div class="after">Después: ${euro(a)}/mes</div>`:''}</div><div class="summary-section-title">Tarifa base</div><div class="detail" style="color:var(--ink)">${esc(S.base.name)}</div><div class="summary-chip-list">${(S.base.tags||[]).map(t=>`<span class="summary-chip">${esc(t)}</span>`).join('')}</div><div class="break"><div class="row"><span>Tarifa base</span><b>${euro(S.base.price)}</b></div>${lt?`<div class="row"><span>Líneas adicionales</span><b>+${euro(lt)}</b></div>`:''}${et?`<div class="row"><span>Extras</span><b>+${euro(et)}</b></div>`:''}<div class="row total"><span>TOTAL</span><b>${euro(t)}</b></div></div>${inc.length?`<div class="summary-section-title">Incluido</div><div class="summary-chip-list">${inc.map(x=>`<span class="summary-chip">✓ ${esc(x)}</span>`).join('')}</div>`:''}${S.lines.length?`<div class="summary-section-title">Líneas adicionales</div><div class="detail" style="color:var(--ink)">${S.lines.map(x=>esc(x.name)).join(' · ')}</div>`:''}${S.extras.length?`<div class="summary-section-title">Extras añadidos</div><div class="detail" style="color:var(--ink)">${S.extras.map(x=>esc(x.name)).join(' · ')}</div>`:''}<div class="alert">ℹ️ ${esc(d.conditions[0])}</div><div class="actions"><button class="btn primary ${d.cls} block" id="client">👤 Ver oferta para cliente</button><button class="btn block" id="reset">Reiniciar tarifa</button></div></div>`;document.getElementById('client').onclick=()=>{S.client=true;clientView()};document.getElementById('reset').onclick=confirmReset}
function confirmReset(){const m=document.createElement('div');m.className='modal-bg';m.innerHTML=`<div class="modal confirm-modal" role="dialog" aria-modal="true"><h2>¿Reiniciar configuración?</h2><p>Se eliminarán la tarifa seleccionada, las líneas adicionales y los extras.</p><div class="confirm-actions"><button class="btn" id="cancelReset">Cancelar</button><button class="btn primary ${DATA[S.company].cls}" id="confirmReset">Reiniciar</button></div></div>`;document.body.appendChild(m);document.getElementById('cancelReset').onclick=()=>m.remove();document.getElementById('confirmReset').onclick=()=>{m.remove();resetConfig();renderTab();showToast('Configuración reiniciada')}}

function searchView(c){const d=DATA[S.company],q=S.search.trim().toLowerCase();let p=[...allBases(),...(d.lines||[]).map(x=>({id:'line-'+x.id,name:'Línea adicional · '+x.name,price:x.price,after:null,tags:['Línea adicional'],note:'Línea adicional'})),...(d.extras||[]).map(x=>({id:'extra-'+x.id,name:x.name,price:x.price,after:null,tags:['Extra'],note:x.note}))];const terms=q.split(/\s+/).filter(Boolean);p=p.filter(x=>{const hay=(x.name+' '+(x.note||'')+' '+(x.tags||[]).join(' ')).toLowerCase();return terms.every(t=>hay.includes(t))});c.innerHTML=`<div class="card"><div class="section-top"><h3>Buscar en ${esc(d.name)}</h3><span class="tiny muted">${p.length} resultados</span></div><div class="results">${p.length?p.map(x=>`<div class="result"><span class="price">${euro(x.price)}/mes</span><strong>${esc(x.name)}</strong><p>${esc(x.note||sourceLabel(x))}${x.after!=null?' · Después '+euro(x.after)+'/mes':''}</p></div>`).join(''):`<div class="empty">No se han encontrado resultados.</div>`}</div></div>`}

function conditions(){const d=DATA[S.company],m=document.createElement('div');m.className='modal-bg';m.innerHTML=`<div class="modal"><div class="modal-head"><h2>Condiciones · ${esc(d.name)}</h2><button class="btn" id="close">Cerrar</button></div>${d.conditions.map(x=>`<div class="condition">✓ ${esc(x)}</div>`).join('')}<p class="tiny muted" style="margin-top:13px">Verifica siempre las condiciones vigentes antes de contratar.</p></div>`;document.body.appendChild(m);m.onclick=e=>{if(e.target===m||e.target.id==='close')m.remove()}}
function showPrivateModal(onAccept){const m=document.createElement('div');m.className='modal-bg';m.innerHTML=`<div class="modal private-modal" role="dialog" aria-modal="true"><div class="private-icon">⚠️</div><h2>¡Importante!</h2><p class="important">Recuerda que la venta de esta tarifa se realiza de manera puntual. Debes preguntar a tu coordinador.</p><div class="modal-actions"><button class="btn primary vf accept" id="acceptPrivate">Aceptar</button></div></div>`;document.body.appendChild(m);document.getElementById('acceptPrivate').onclick=()=>{m.remove();onAccept()}}
function clientView(){if(!S.base){S.client=false;workspace();return}const d=DATA[S.company],t=total(),a=after(),inc=includedExtras();app.innerHTML=`<header class="header"><div class="container header-in"><div class="brand"><span class="brand-grupo">Grupo</span> <span class="brand-acerca">ACERCA</span></div><button class="btn no-print" id="backClient">← Volver al comercial</button></div></header><main><div class="container"><div class="client"><div class="client-card"><div class="client-head"><div><div class="client-brand ${d.cls}">${esc(d.name)}</div><h1>Tu oferta${''}</h1><div class="muted small">Propuesta preparada por Grupo ACERCA</div></div></div><div class="client-price">${euro(t)} <span style="font-size:12px">/mes</span></div>${a!=null?`<div class="muted small">Después: <b>${euro(a)}/mes</b></div>`:''}<div style="margin-top:20px"><div class="summary-section-title">Tarifa contratada</div><div class="client-item"><span><b>${esc(S.base.name)}</b><br><span class="muted">${esc(sourceLabel(S.base))}</span></span><b>${euro(S.base.price)}</b></div>${Array.from({length:S.base.lines||0}).map((_,i)=>`<div class="client-item"><span>✓ Línea ${i+1} incluida</span><span>Incluida</span></div>`).join('')}${S.lines.map(x=>`<div class="client-item"><span>✓ Línea adicional · ${esc(x.name)}</span><b>+${euro(x.price)}</b></div>`).join('')}${inc.map(x=>`<div class="client-item"><span>✓ ${esc(x)}</span><span>Incluido</span></div>`).join('')}${S.extras.map(x=>`<div class="client-item"><span>✓ ${esc(x.name)}</span><b>+${euro(x.price)}</b></div>`).join('')}</div>${S.base.private?`<div class="client-note"><b>Oferta privada:</b> venta puntual. Consulta con tu coordinador.</div>`:`<div class="client-note">Precios con IVA incluido. Las condiciones de permanencia, promociones y evolución del precio dependen de la tarifa seleccionada.</div>`}</div></div></div></main>`;document.getElementById('backClient').onclick=()=>{S.client=false;workspace()}}
function renderMobileTotal(){document.getElementById('mobileTotal')?.remove();if(!S.base||S.client)return;const d=DATA[S.company],t=total(),a=after();const el=document.createElement('div');el.id='mobileTotal';el.className='mobile-total';el.innerHTML=`<div class="mobile-total-in"><div class="mobile-price"><strong>${euro(t)}/mes</strong><span>${a!=null?'Después '+euro(a)+'/mes':'Precio mensual'}</span></div><button class="btn primary ${d.cls}" id="mobileOffer">Ver oferta</button></div>`;document.body.appendChild(el);document.getElementById('mobileOffer').onclick=()=>{S.client=true;clientView()}}
home();
</script>
</body>
</html>
